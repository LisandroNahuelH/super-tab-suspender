name: Bug report
description: Something is broken - help me reproduce it.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Precise steps get it fixed faster.

        Please do not paste tokens, personal data or full storage dumps.
  - type: input
    id: version
    attributes:
      label: Extension version
      description: Shown on the extension's card in chrome://extensions.
      placeholder: "0.2.11"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
      placeholder: "Chrome 141.0.7390.55 on Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact clicks and pages, in order. Say whether the tab was pinned, playing audio or holding form input.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected vs actual
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Service-worker console output
      description: "chrome://extensions -> the extension's card -> service worker -> Console. Paste only relevant lines."
      render: text
    validations:
      required: false
