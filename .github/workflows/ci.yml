# CI: the same verification chain the repository runs before a release.
# Linux runner on purpose: every text file is pinned to LF by .gitattributes
# (`* text=auto eol=lf`), so results cannot differ because of a Windows checkout.
# No secrets are required, and nothing is published to the Chrome Web Store here.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify (localization audits, typecheck, tests, bundle)
        run: npm run verify
